<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>AI Wellbeing Buffer</title>
<style>
  :root {
    --bg: #0d0f18;
    --panel: #161a2b;
    --cyan: #00f6ff;
    --magenta: #ff2bd6;
    --purple: #b967ff;
    --orange: #ff9f1c;
    --red: #ff3860;
    --text: #e8f1ff;
    --muted: #8b93ad;
  }

  * { box-sizing: border-box; }

  body {
    width: 340px;
    margin: 0;
    padding: 16px;
    background: radial-gradient(circle at top left, #191d31, var(--bg));
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
  }

  h1 {
    font-size: 15px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin: 0 0 4px 0;
    background: linear-gradient(90deg, var(--cyan), var(--magenta));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 16px;
  }

  section {
    background: var(--panel);
    border: 1px solid rgba(0, 246, 255, 0.12);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 12px;
  }

  section h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 0 0 10px 0;
  }

  /* --- Sensitivity slider --- */
  .slider-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  input[type="range"] {
    flex: 1;
    accent-color: var(--cyan);
  }

  #thresholdValue {
    font-weight: 700;
    color: var(--cyan);
    min-width: 34px;
    text-align: right;
    font-size: 13px;
  }

  /* --- Trigger tags --- */
  .tag-input-row {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
  }

  #tagInput {
    flex: 1;
    background: #0d0f18;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 6px;
    padding: 6px 8px;
    color: var(--text);
    font-size: 12px;
  }

  #addTagBtn {
    background: var(--purple);
    border: none;
    color: #1a0033;
    font-weight: 700;
    border-radius: 6px;
    padding: 6px 10px;
    cursor: pointer;
    font-size: 12px;
  }

  #tagList {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .tag-chip {
    background: rgba(185, 103, 255, 0.15);
    border: 1px solid var(--purple);
    color: var(--purple);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 11px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .tag-chip button {
    background: none;
    border: none;
    color: var(--purple);
    cursor: pointer;
    font-size: 12px;
    line-height: 1;
    padding: 0;
  }

  /* --- Toggles --- */
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    font-size: 12px;
  }
  .toggle-row:last-child { margin-bottom: 0; }

  .switch {
    position: relative;
    display: inline-block;
    width: 38px;
    height: 20px;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider-track {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background-color: #2a2f45;
    transition: 0.2s;
    border-radius: 999px;
  }
  .slider-track:before {
    position: absolute;
    content: "";
    height: 14px;
    width: 14px;
    left: 3px;
    bottom: 3px;
    background-color: var(--text);
    transition: 0.2s;
    border-radius: 50%;
  }
  input:checked + .slider-track {
    background-color: var(--cyan);
  }
  input:checked + .slider-track:before {
    transform: translateX(18px);
  }

  /* --- Mood dashboard --- */
  .mood-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 10px;
  }

  .stat-box {
    background: #0d0f18;
    border-radius: 8px;
    padding: 8px 10px;
    text-align: center;
  }

  .stat-value {
    font-size: 18px;
    font-weight: 800;
    color: var(--cyan);
  }

  .stat-label {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-top: 2px;
  }

  #moodScoreWrap {
    text-align: center;
    padding: 10px 0 4px 0;
  }

  #moodScoreValue {
    font-size: 30px;
    font-weight: 900;
    background: linear-gradient(90deg, var(--cyan), var(--purple));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  #moodSummary {
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
  }

  #resetSessionBtn {
    width: 100%;
    margin-top: 10px;
    padding: 8px;
    background: transparent;
    border: 1px solid var(--red);
    color: var(--red);
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  #resetSessionBtn:hover {
    background: var(--red);
    color: #1a0007;
  }

  #backendStatus {
    font-size: 10px;
    text-align: center;
    color: var(--muted);
    margin-top: 4px;
  }
</style>
</head>
<body>
  <h1>AI Wellbeing Buffer</h1>
  <div class="subtitle">Locally-hosted models · your rules, your feed</div>

  <section>
    <h2>Sensitivity Threshold</h2>
    <div class="slider-row">
      <input type="range" id="thresholdSlider" min="0.1" max="1.0" step="0.05" value="0.5" />
      <span id="thresholdValue">0.50</span>
    </div>
  </section>

  <section>
    <h2>Topics to Avoid (Semantic Triggers)</h2>
    <div class="tag-input-row">
      <input type="text" id="tagInput" placeholder="e.g. spoilers, politics, crypto" />
      <button id="addTagBtn">Add</button>
    </div>
    <div id="tagList"></div>
  </section>

  <section>
    <h2>Filters</h2>
    <div class="toggle-row">
      <span>NSFW Image Filtering</span>
      <label class="switch">
        <input type="checkbox" id="nsfwToggle" />
        <span class="slider-track"></span>
      </label>
    </div>
    <div class="toggle-row">
      <span>Pre-Post Draft Checking</span>
      <label class="switch">
        <input type="checkbox" id="draftToggle" />
        <span class="slider-track"></span>
      </label>
    </div>
  </section>

  <section>
    <h2>Mood &amp; Wellbeing Dashboard</h2>
    <div class="mood-stats">
      <div class="stat-box">
        <div class="stat-value" id="scrollTimeValue">0 Mins</div>
        <div class="stat-label">Scrolling Time</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" id="totalBlockedValue">0</div>
        <div class="stat-label">Items Blocked</div>
      </div>
    </div>
    <div id="moodScoreWrap">
      <div id="moodScoreValue">--%</div>
      <div class="stat-label">Mental Peace Preserved</div>
      <div id="moodSummary"></div>
    </div>
    <button id="resetSessionBtn">Reset Session</button>
    <div id="backendStatus"></div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
