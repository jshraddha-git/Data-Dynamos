<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Wellbeing Buffer</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --panel: #12121a;
      --border: #23233099;
      --text: #e8e8f0;
      --text-dim: #9a9ab0;
      --cyan: #34e0ff;
      --red: #ff3860;
      --orange: #ff8c1a;
      --purple: #b967ff;
      --green: #37f2a1;
    }

    * { box-sizing: border-box; }

    body {
      width: 340px;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
    }

    header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: 15px;
      margin: 0 0 2px;
      color: var(--cyan);
      letter-spacing: 0.3px;
    }

    header p {
      margin: 0;
      color: var(--text-dim);
      font-size: 11.5px;
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
      background: var(--text-dim);
    }
    .status-dot.online { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .status-dot.offline { background: var(--red); box-shadow: 0 0 6px var(--red); }

    section {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }

    section h2 {
      font-size: 11.5px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-dim);
      margin: 0 0 10px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .row:last-child { margin-bottom: 0; }

    input[type="range"] {
      width: 100%;
      accent-color: var(--cyan);
    }

    #thresholdValue {
      color: var(--cyan);
      font-weight: 700;
      min-width: 34px;
      text-align: right;
    }

    .toggle-label { color: var(--text); }

    .switch {
      position: relative;
      width: 38px;
      height: 20px;
      flex-shrink: 0;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider-toggle {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: #2a2a38;
      border-radius: 999px;
      transition: 0.2s;
    }
    .slider-toggle::before {
      content: "";
      position: absolute;
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background: var(--text-dim);
      border-radius: 50%;
      transition: 0.2s;
    }
    input:checked + .slider-toggle { background: rgba(52, 224, 255, 0.25); }
    input:checked + .slider-toggle::before { background: var(--cyan); transform: translateX(18px); }

    #triggerTags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
      min-height: 20px;
    }

    .tag {
      background: rgba(185, 103, 255, 0.15);
      border: 1px solid var(--purple);
      color: var(--purple);
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 11.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tag button {
      background: none;
      border: none;
      color: var(--purple);
      cursor: pointer;
      font-size: 12px;
      line-height: 1;
      padding: 0;
    }

    #triggerInput {
      width: 100%;
      padding: 7px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font-size: 12.5px;
    }
    #triggerInput:focus { outline: 1px solid var(--cyan); }

    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    .stat-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      text-align: center;
    }

    .stat-box .value {
      font-size: 17px;
      font-weight: 700;
      color: var(--cyan);
    }

    .stat-box .label {
      font-size: 10px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-top: 2px;
    }

    #moodScoreBox {
      background: linear-gradient(135deg, rgba(52,224,255,0.08), rgba(185,103,255,0.08));
      border: 1px solid var(--cyan);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }

    #moodScoreValue {
      font-size: 28px;
      font-weight: 800;
      color: var(--green);
    }

    #moodSummary {
      color: var(--text-dim);
      font-size: 11px;
      margin-top: 6px;
      line-height: 1.4;
    }

    .refresh-btn {
      width: 100%;
      margin-top: 10px;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid var(--cyan);
      background: rgba(52, 224, 255, 0.08);
      color: var(--cyan);
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
    }
    .refresh-btn:hover { background: rgba(52, 224, 255, 0.18); }

    footer {
      padding: 8px 16px;
      font-size: 10px;
      color: var(--text-dim);
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <h1>🛡 AI Wellbeing Buffer</h1>
    <p><span id="statusDot" class="status-dot"></span><span id="statusText">Checking backend…</span></p>
  </header>

  <section>
    <h2>Sensitivity</h2>
    <div class="row">
      <input type="range" id="thresholdSlider" min="0.1" max="1.0" step="0.05" />
      <span id="thresholdValue">0.50</span>
    </div>
    <div class="row">
      <span class="toggle-label">Master enable</span>
      <label class="switch">
        <input type="checkbox" id="enabledToggle" />
        <span class="slider-toggle"></span>
      </label>
    </div>
    <div class="row">
      <span class="toggle-label">NSFW image filtering</span>
      <label class="switch">
        <input type="checkbox" id="nsfwToggle" />
        <span class="slider-toggle"></span>
      </label>
    </div>
    <div class="row">
      <span class="toggle-label">Pre-post draft check</span>
      <label class="switch">
        <input type="checkbox" id="draftToggle" />
        <span class="slider-toggle"></span>
      </label>
    </div>
  </section>

  <section>
    <h2>Topics to Avoid</h2>
    <div id="triggerTags"></div>
    <input type="text" id="triggerInput" placeholder="Type a topic and press Enter (e.g. spoilers)" />
  </section>

  <section>
    <h2>This Session</h2>
    <div class="stat-grid">
      <div class="stat-box">
        <div class="value" id="statTime">0m</div>
        <div class="label">Scrolling</div>
      </div>
      <div class="stat-box">
        <div class="value" id="statBlocked">0</div>
        <div class="label">Items Blocked</div>
      </div>
    </div>
    <div id="moodScoreBox">
      <div id="moodScoreValue">—</div>
      <div class="label" style="color: var(--text-dim); font-size: 10px; margin-top: 2px;">MENTAL PEACE PRESERVED</div>
      <div id="moodSummary">Waiting for session data…</div>
    </div>
    <button class="refresh-btn" id="refreshMoodBtn">Refresh Wellbeing Score</button>
  </section>

  <footer>Local models only · no data leaves your machine</footer>

  <script src="popup.js"></script>
</body>
</html>
